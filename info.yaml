# Tiny Tapeout project information
project:
  title:        "SNN Arrhythmia Detector"      # Project title
  author:       "Vicente Antonio San Martín Fuentes"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Spiking neural network that classifies heartbeats and detects consecutive anomalies for arrhythmia alerting."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     40000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_arrhythmia_detector"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "SNN_Heart_Monitor_Top.v"
    - "Delta_Encoder.v"
    - "Heartbeat_Segmenter.v"
    - "Parallel_SNN_Matrix.v"
    - "Heart_Monitor_Neuron.v"
    - "MultiClass_SNN_Voter.v"
    - "Decision_Engine.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "ADC_data[0]"
  ui[1]: "ADC_data[1]"
  ui[2]: "ADC_data[2]"
  ui[3]: "ADC_data[3]"
  ui[4]: "ADC_data[4]"
  ui[5]: "ADC_data[5]"
  ui[6]: "ADC_data[6]"
  ui[7]: "ADC_data[7]"

  # Outputs
  uo[0]: "alarm"
  uo[1]: "pattern_detected"
  uo[2]: "class_out[0]"
  uo[3]: "class_out[1]"
  uo[4]: "class_out[2]"
  uo[5]: "diagnostic_valid"
  uo[6]: "alarm_strobe"
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "ADC_data[8]"
  uio[1]: "ADC_data[9]"
  uio[2]: "ADC_data[10]"
  uio[3]: "ADC_data[11]"
  uio[4]: "sample_en"
  uio[5]: "mode_sel"
  uio[6]: "force_class"
  uio[7]: ""

# Do not change!
yaml_version: 6
